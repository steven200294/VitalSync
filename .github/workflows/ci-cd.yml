name: VitalSync CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  # Etape 1 - Lint et Tests
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dependances
        run: cd backend && npm install

      - name: Lint avec ESLint
        run: cd backend && npm run lint

      - name: Execution des tests unitaires
        run: cd backend && npm test

  # Etape 2 - Build Docker
  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au registry GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push image backend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} ./backend
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build et push image frontend
        run: |
          docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} ./frontend
          docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  # Etape 3 - Deploiement staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Deploiement avec Docker Compose
        run: |
          echo "POSTGRES_USER=vitalsync" >> .env
          echo "POSTGRES_PASSWORD=secret123" >> .env
          echo "POSTGRES_DB=vitalsync_db" >> .env
          docker compose up -d --build

      - name: Attente du demarrage des services
        run: sleep 10

      - name: Health check du backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed with status $STATUS"

      - name: Arret des services
        if: always()
        run: docker compose down
